name: PR Title Check

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  title:
    runs-on: ubuntu-latest

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          githubBaseUrl: https://api.github.com
          types: |
            feat
            fix
            chore
            test
            refactor
            docs
            style
            perf
            deploy
