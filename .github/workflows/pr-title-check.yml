name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize]


    
jobs:
  title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          types: |
            feat
            fix
            chore
            test
            refactor
            docs
            style
            perf
            deploy
