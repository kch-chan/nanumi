name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_projects: ${{ steps.detect.outputs.has_projects }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 변경된 폴더 & 프로젝트 타입 감지
        id: detect
        run: |
          detect_project() {
            local dir="$1"
            while [ "$dir" != "." ]; do
              if [ -f "$dir/package.json" ]; then
                echo "$dir:node"; return
              elif [ -f "$dir/pom.xml" ] || [ -f "$dir/mvnw" ]; then
                echo "$dir:maven"; return
              elif [ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]; then
                echo "$dir:gradle"; return
              fi
              dir=$(dirname "$dir")
            done
          }

          PROJECTS=$(
            git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | while read -r file; do
                dir=$(dirname "$file")
                detect_project "$dir"
              done \
            | sort -u
          )

          MATRIX="[]"

          for PROJECT in $PROJECTS; do
            DIR="${PROJECT%%:*}"
            TYPE="${PROJECT##*:}"

            MATRIX=$(echo "$MATRIX" | jq -c \
              --arg dir "$DIR" \
              --arg type "$TYPE" \
              '. + [{"dir": $dir, "type": $type}]')
          done

          echo "감지된 프로젝트: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          if [ "$MATRIX" = "[]" ]; then
            echo "has_projects=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_projects=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: "Check: ${{ matrix.project.dir }} (${{ matrix.project.type }})"
    needs: detect
    if: needs.detect.outputs.has_projects == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect.outputs.matrix) }}

    # 백엔드 테스트는 실제 PostgreSQL 에 붙음(H2 를 쓰지 않음).
    # 그래야 db/migration 의 SQL 이 진짜로 도는지, 엔티티와 스키마가 맞는지 확인됨.
    # 운영은 ddl-auto: validate 라서 어긋나면 "배포 기동 실패"로 처음 알게 되는데, 그 구멍을 여기서 막음
    #
    # node 잡에서도 같이 뜨지만 쓰지 않을 뿐이라 해로울 것은 없음
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nanumi_test
          POSTGRES_USER: abc
          POSTGRES_PASSWORD: aadd123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U abc -d nanumi_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: matrix.project.type == 'node'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.project.dir }}/package.json

      - name: Setup Node
        if: matrix.project.type == 'node'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.project.dir }}/pnpm-lock.yaml

      - name: React - Install & Lint
        if: matrix.project.type == 'node'
        working-directory: ${{ matrix.project.dir }}
        run: |
          pnpm install --frozen-lockfile
          if grep -q '"lint"' package.json; then
            pnpm run lint
          else
            echo "lint 스크립트 없음, skip"
          fi
          if grep -q '"test"' package.json; then
            pnpm run test
          else
            echo "test 스크립트 없음, skip"
          fi

      - name: Setup Java (Maven)
        if: matrix.project.type == 'maven'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      # 시크릿이 실제로 등록돼 있는지만 확인함. 값은 찍지 않음
      - name: GitHub Secrets 등록 확인
        if: matrix.project.type == 'maven'
        env:
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          for name in PASSWORD_PEPPER DB_PASSWORD JWT_PRIVATE_KEY JWT_PUBLIC_KEY; do
            if [ -n "${!name}" ]; then
              echo "  $name: 등록됨"
            else
              echo "  $name: 없음 (운영 배포 전에 넣어야 함)"
            fi
          done

      - name: Spring Boot (Maven) - Verify
        if: matrix.project.type == 'maven'
        working-directory: ${{ matrix.project.dir }}
        env:
          # 위 서비스 컨테이너를 가리킴. application-test.yml 의 기본값과 같지만 명시해 둠
          TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/nanumi_test
          TEST_DB_USERNAME: abc
          TEST_DB_PASSWORD: aadd123
        run: |
          if [ -f "mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw verify
          else
            mvn verify
          fi

      - name: Setup Java (Gradle)
        if: matrix.project.type == 'gradle'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Spring Boot (Gradle) - Check
        if: matrix.project.type == 'gradle'
        working-directory: ${{ matrix.project.dir }}
        run: |
          if [ -f "gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew check
          else
            gradle check
          fi
