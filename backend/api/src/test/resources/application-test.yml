# 테스트 전용 설정
#
# 실제 실행은 MySQL 만 씀. 여기 H2 를 두는 이유는 CI 에 DB 를 띄우지 않고도
# 파생 쿼리(findByUser_Id 처럼 메서드 이름으로 만들어지는 쿼리)가 성립하는지 확인하기 위함임
# MODE=PostgreSQL 로 PostgreSQL 문법을 흉내 냄
spring:
  datasource:
    url: jdbc:h2:mem:nanumi-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # 테스트는 Flyway 를 쓰지 않음
  # db/migration 의 SQL 이 PostgreSQL 문법(GENERATED AS IDENTITY)이라 H2 에서 그대로 돌지 않고,
  # 테스트마다 빈 DB 를 새로 만들므로 이력 관리도 의미가 없음
  flyway:
    enabled: false

  jpa:
    hibernate:
      # 개발·운영은 validate 지만 테스트에서는 Hibernate 가 스키마를 만듦
      # Flyway 를 껐으므로 만들어 줄 주체가 필요함
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

nanumi:
  security:
    password:
      # 테스트에서만 쓰는 pepper. 운영·개발 값과 달라도 됨(테스트마다 새로 해싱하므로)
      # 다만 비어 있으면 NanumiPasswordProperties 가 기동을 막으므로 반드시 있어야 함
      pepper: nanumi-test-pepper
