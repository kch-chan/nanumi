spring:
  application:
    name: api
  profiles:
    active: dev

jwt:
  # 로그아웃이나 탈퇴를 해도 이미 나간 액세스 토큰은 만료될 때까지 살아 있음
  # 토큰마다 DB 를 뒤지지 않는 대신 수명을 짧게 잡아서 그 틈을 줄임
  access-token-expiration: 900000 # 15분
  refresh-token-expiration: 1209600000 # 14일

nanumi:
  security:
    password:
      # PBKDF2 반복 횟수. 해시에 같이 적히므로 나중에 올려도 기존 계정은 그대로 로그인됨
      iterations: 210000
      # 서버만 아는 비밀값. 운영에서는 반드시 환경 변수로 덮어써야 함
      pepper: ${PASSWORD_PEPPER:nanumi-local-dev-pepper}
    cors:
      # 브라우저에서 이 API 를 직접 부를 수 있는 출처. 개발용 Vite 서버 주소임
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  # 오류 응답에 예외 이름이나 스택이 섞여 나가지 않도록 막음
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

  # X-Forwarded-For 를 믿을지 정함
  # 프록시가 바깥에서 들어온 헤더를 지워 준다는 보장이 없으면 켜면 안 됨
  # 켜는 순간 헤더만 바꿔 가며 로그인 잠금을 통과할 수 있게 됨
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
