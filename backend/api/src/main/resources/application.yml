spring:
  application:
    name: api
  profiles:
    active: dev

jwt:
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 1209600000 # 14일

nanumi:
  security:
    password:
      # PBKDF2 반복 횟수. 해시에 같이 적히므로 나중에 올려도 기존 계정은 그대로 로그인됨
      iterations: 210000
      # 서버만 아는 비밀값. 운영에서는 반드시 환경 변수로 덮어써야 함
      pepper: ${PASSWORD_PEPPER:nanumi-local-dev-pepper}
    cors:
      # 브라우저에서 이 API 를 직접 부를 수 있는 출처. 개발용 Vite 서버 주소임
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 오류 응답에 예외 이름이나 스택이 섞여 나가지 않도록 막음
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
