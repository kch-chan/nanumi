# ---------------------------------------------------------------------------
# 나누미 API 설정
#
# 파일 하나에 프로필별 설정을 --- 로 나눠서 담음(스프링 부트의 다중 문서 방식).
# 위쪽은 모든 프로필에 공통으로 적용되고, 아래 문서들은 해당 프로필일 때만 덧씌워짐.
#
# 값이 들어오는 경로:
#   개발  - 아래 기본값 그대로 씀. 내 PC 만 다른 값은 .env.dev 에 적음(git 에 안 올라감)
#   테스트 - 이 파일을 쓰지 않음. src/test/resources/application-test.yml 의 값을 씀
#           (테스트 DB, 테스트 pepper, 기동할 때 만드는 JWT 키. GitHub Secrets 를 쓰지 않음)
#   운영  - Render 대시보드의 환경 변수와 Secret Files 로 들어옴
#           (GitHub Actions 는 테스트만 돌리고 배포하지 않음. Render 가 저장소를 직접 받아 빌드함)
#
# 개발용 기본값은 비밀이 아님(내 PC 의 버리는 DB 라서).
# 진짜 비밀값은 기본값이 없음 -> 없으면 기동이 실패함.
# 누가 들고 있고 어디에 백업하는지는 docs/deployment.md 의 "운영 비밀값" 항목에 적어 둠.
# ---------------------------------------------------------------------------
spring:
  application:
    name: api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  lifecycle:
    # server.shutdown: graceful 로 내려갈 때 처리 중인 요청을 기다릴 최대 시간임
    # 이 시간이 지나면 남은 요청을 끊고 내려감
    timeout-per-shutdown-phase: 20s

  datasource:
    driver-class-name: org.postgresql.Driver

    # Neon 무료 등급은 약 5분 유휴면 컴퓨트를 중지하고 TCP 연결을 끊음.
    # 기본값(max-lifetime 30분)으로 두면 이미 끊긴 연결을 붙들고 있다가
    # 다음 요청에서 실패함. 그래서 수명을 중지 시점보다 짧게 잡음
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000 # 4분. Neon 유휴 중지(약 5분)보다 짧아야 함

  jpa:
    # 요청이 끝날 때까지 커넥션을 붙들지 않게 함. 기본값이 true 라서
    # 화면을 그리는 동안에도 DB 연결을 쥐고 있어 풀이 금방 마름
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 스키마 변경 이력. db/migration 의 V숫자__이름.sql 을 순서대로 적용함
  # 이미 적용한 파일은 flyway_schema_history 테이블에 기록되어 다시 실행되지 않음
  flyway:
    enabled: true

jwt:
  # 유효 기간 설정. 세션/쿠키 방식이 아니라 jwt 방식이기 때문에 서버에서 자체 폐기 위함
  access-token-expiration: 900000 # 15분
  refresh-token-expiration: 1209600000 # 14일

  # 키를 넣는 방법은 두 가지임
  #  1) 파일 경로 (아래 두 줄) - 로컬 개발과 운영에서 씀
  #     운영은 Render Secret Files 가 /etc/secrets/ 에 파일로 놓아 줌
  #  2) PEM 본문 직접 (JWT_PRIVATE_KEY/JWT_PUBLIC_KEY) - 파일을 못 쓰는 환경을 위한 대안
  # 본문이 비어 있지 않으면 본문이 우선하고, 비어 있으면 경로를 읽음
  # 테스트는 둘 다 없이 기동할 때 한 쌍 만들어 씀(application-test.yml)
  private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:keys/private_key.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public_key.pem}
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}

nanumi:
  security:
    password:
      # PBKDF2 반복 횟수. 해시에 같이 적히므로 나중에 올려도 기존 계정은 그대로 로그인됨
      # Render 무료 등급은 CPU 를 조금만 주므로 21만 회는 로그인이 수 초 걸릴 수 있음.
      # 해시에 반복 횟수가 같이 적히므로 나중에 올려도 기존 계정은 그대로 로그인됨
      iterations: ${PASSWORD_ITERATIONS:100000}
    cors:
      # 브라우저에서 이 API 를 직접 부를 수 있는 출처
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

    # 우리 앞에 둔 프록시 수. 시도 제한이 쓸 접속자 IP 를 어디서 읽을지 정함
    # 왜 숫자인지는 ClientIpProperties 주석 참고. 로컬은 프록시가 없으므로 0
    client-ip:
      trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}

  # 개인정보 보유 기한. 화면에 보여 주는 약관(frontend/src/constants/terms.ts)과 같아야 함
  # 기한이 지난 탈퇴 회원의 행은 WithdrawnDataPurgeService 가 실제로 지움
  privacy:
    withdrawn-retention-days: ${WITHDRAWN_RETENTION_DAYS:30}
    # 고정 시각이 아니라 간격으로 돌림. 무료 등급은 인스턴스가 잠들어 있을 수 있어서
    # "새벽 4시" 같은 시각을 잡으면 한 번도 안 돌 수 있음
    purge-initial-delay: PT2M
    purge-interval: PT6H

management:
  endpoints:
    web:
      exposure:
        # health 만 엶. 나머지(env, beans 등)는 설정값과 구조를 노출하므로 닫아 둠
        include: health
  endpoint:
    health:
      # UP/DOWN 만 내려줌. DB 주소 같은 상세는 감춤
      show-details: never
      # /actuator/health 는 DB 까지 확인하므로, Neon 이 유휴 중지된 동안에는
      # DOWN 이 나올 수 있음. 그걸 보고 플랫폼이 인스턴스를 재시작해 버림.
      # liveness 는 "앱이 살아 있는지"만 보므로 배포 플랫폼의 확인 경로로 씀
      # (DB 상태는 /actuator/health 로 따로 볼 수 있음)
      group:
        liveness:
          include: livenessState
        # DB 까지 확인함. 배포 판정에는 쓰지 않고 감시·알림에서 봄
        # 배포 판정에 넣으면 Neon 이 유휴 중지된 동안 DOWN 이 되어
        # 멀쩡한 인스턴스가 재시작됨(그래서 render.yaml 은 liveness 를 가리킴)
        readiness:
          include: readinessState,db

# 참고: /actuator/health 는 SecurityConfig 에서 인증 없이 열어 둠

server:
  # 플랫폼이 포트를 정해 주는 환경(Render, Heroku 등)에서는 PORT 환경 변수를 따라야 함
  # 그런 환경에서 8080 을 고정하면 바깥에서 접속이 안 됨
  port: ${PORT:8080}

  # 오류 응답에 예외 이름이나 스택이 섞여 나가지 않도록 막음
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

  # none 으로 둬야 함. 켜면 스프링이 X-Forwarded-For 를 요청에서 떼어 내고
  # getRemoteAddr() 를 "목록의 맨 앞" 값으로 바꿔 놓는데, 맨 앞은 요청하는 쪽이 지어낼 수 있는 자리임
  # 접속자 IP 는 대신 ClientIpResolver 가 목록의 뒤에서부터 읽음(trusted-proxy-count)
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

  # 종료 신호를 받으면 처리 중인 요청을 끝낸 뒤에 내려감
  # 기본값(immediate)이면 재배포할 때 그 순간 처리 중이던 요청이 끊겨서
  # 가입·탈퇴 같은 쓰기 요청이 중간에 잘릴 수 있음.
  # Render 는 SIGTERM 을 보내고 잠시 기다리므로 그 시간을 이렇게 씀
  # (기다릴 최대 시간은 위 spring.lifecycle.timeout-per-shutdown-phase 에 있음)
  shutdown: graceful

---
# ===== 개발 =================================================================
# 리뷰 받는 용
spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:file:./.env.dev[.properties]
      - optional:file:./backend/api/.env.dev[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/nanumi_dev}
    username: ${DB_USERNAME:abc}
    password: ${DB_PASSWORD:aadd123}

  jpa:
    hibernate:
      # 운영과 같은 값을 씀. 스키마는 Flyway 가 db/migration 의 SQL 로 만듦
      # update 로 두면 Hibernate 가 테이블을 몰래 고쳐서, 마이그레이션을 안 쓴 걸
      # 운영 배포 때 처음 알게 됨. validate 면 개발 단계에서 바로 막힘
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

nanumi:
  security:
    password:
      pepper: ${PASSWORD_PEPPER:nanumi-local-dev-pepper}

jwt:
  # 키 파일이 없으면 기동할 때 한 쌍 만들어 씀
  # 저장소를 새로 받으면 keys/*.pem 이 없음(.gitignore 대상)
  # 재시작하면 토큰이 무효가 되지만 개발에서는 다시 로그인하면 되므로 무해함
  generate-key-if-missing: true

logging:
  level:
    com.nanumi: debug

---
# ===== 운영 =================================================================
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:file:./.env.prod[.properties]
      - optional:file:./backend/api/.env.prod[.properties]

  datasource:
    # Neon 이 주는 주소를 JDBC 형식으로 바꿔서 넣음
    #   Neon 화면:  postgresql://계정:비번@ep-xxx.ap-southeast-1.aws.neon.tech/nanumi?sslmode=require
    #   여기 넣을 값: jdbc:postgresql://ep-xxx.ap-southeast-1.aws.neon.tech/nanumi?sslmode=require
    # 계정과 비밀번호는 URL 에서 빼서 아래 두 줄로 따로 넣음
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 운영에서는 스키마를 건드리지 않고, 엔티티와 다르면 기동을 거부함
      ddl-auto: validate
    show-sql: false

nanumi:
  security:
    password:
      # 기본값 없음. 없는 상태로 뜨면 기존 비밀번호가 전부 무효가 되므로
      # NanumiPasswordProperties 가 기동을 막음
      pepper: ${PASSWORD_PEPPER}

    # Render 는 프록시 한 대 뒤에 앱을 둠
    # 이 값이 0 이면 모든 이용자가 프록시의 내부 IP 하나를 공유하게 되어,
    # 누군가 다섯 번 가입한 뒤에는 나머지 사람 전부가 429 를 받음
    client-ip:
      trusted-proxy-count: ${TRUSTED_PROXY_COUNT:1}
