spring:
  # 아래 ${} 값들을 .env 파일에서 읽어 옴
  # optional: 이라 파일이 없어도 기동 자체는 진행됨
  #   (운영 서버에서는 systemd/도커가 환경 변수로 직접 넣어 주므로 .env 가 없는 게 정상임)
  # [.properties] 는 확장자 없는 파일을 properties 형식으로 읽으라는 뜻
  # 실행 위치가 backend/api 일 때와 저장소 루트일 때를 모두 커버함
  # 진짜 OS 환경 변수가 있으면 그쪽이 .env 보다 우선함
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/api/.env[.properties]

  datasource:
    # 예: jdbc:mysql://<host>:3306/nanumi?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  h2:
    console:
      enabled: false

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH}
  public-key-path: ${JWT_PUBLIC_KEY_PATH}

nanumi:
  security:
    password:
      iterations: ${PASSWORD_ITERATIONS:210000}
      # 기본값을 두지 않음. .env 나 환경 변수로 반드시 넣어야 함
      # 주의: 값이 없어도 앱은 그냥 뜸. ${...} 가 문자열 그대로 pepper 에 들어가므로 배포 전에 꼭 확인할 것
      pepper: ${PASSWORD_PEPPER}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
