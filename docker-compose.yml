# 개발용 컨테이너 구성
#
#   docker compose up -d                          DB 만 띄움 (평소 개발)
#   docker compose --profile app up -d --build    앱까지 컨테이너로 띄움 (배포 전 확인용)
#   docker compose down                           내리기 (데이터 남음)
#   docker compose down -v                        데이터까지 지우기
#                                                 (V1 을 고쳤을 때. Flyway 가 체크섬을 저장하므로)
#
# 평소 개발은 DB 만 컨테이너로 띄우고 앱은 ./mvnw spring-boot:run 으로 돌리는 게 편함.
# 앱을 컨테이너에 넣으면 코드를 고칠 때마다 이미지를 다시 만들어야 해서 느려짐.
# 그래서 app 서비스는 profile 로 감춰 뒀고, --profile app 을 줄 때만 뜸.
#
# 운영은 Render 의 관리형 PostgreSQL 을 쓰므로 로컬도 PostgreSQL 로 맞춰 둠.
# 로컬만 다른 DB 를 쓰면 SQL 문법 차이를 배포한 뒤에야 알게 됨.
#
# 여기 계정·비밀번호는 비밀값이 아님. 내 PC 안에서만 닿는 개발용 DB 이고,
# application.yml 의 개발용 기본값과 같은 이유로 그대로 적어 둠.
services:
  db:
    image: postgres:18
    container_name: nanumi-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nanumi_dev
      POSTGRES_USER: abc
      POSTGRES_PASSWORD: aadd123
    volumes:
      # 이 줄이 없으면 컨테이너를 지울 때 테이블과 데이터가 함께 사라짐
      # postgres:18 부터는 /var/lib/postgresql 에 붙임(안쪽에 버전별 폴더를 둠).
      # 17 처럼 .../data 에 붙이면 버전 업그레이드 때 기동이 실패함
      - nanumi-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abc -d nanumi_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # 배포 전에 "이미지가 실제로 뜨는지" 확인할 때만 씀
  api:
    profiles: ["app"]
    build: ./backend/api
    image: nanumi/api:latest
    container_name: nanumi-api
    depends_on:
      db:
        # DB 가 준비되기 전에 붙으면 기동이 실패하므로 기다림
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 컨테이너 안에서 localhost 는 "이 컨테이너 자신"이라서 DB 를 못 찾음
      # compose 의 서비스 이름(db)으로 부름
      DB_URL: jdbc:postgresql://db:5432/nanumi_dev
      DB_USERNAME: abc
      DB_PASSWORD: aadd123
      # 운영에서는 이 값이 Render 의 환경 변수에서 옴. 여기 값은 확인용임
      PASSWORD_PEPPER: nanumi-local-dev-pepper
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # 키는 이미지에 없음(.dockerignore). 아래 마운트한 파일을 읽게 함
      # 운영도 같은 구조임 - 이미지는 그대로 두고 키만 바깥에서 넣음
      JWT_PRIVATE_KEY_PATH: file:/keys/private_key.pem
      JWT_PUBLIC_KEY_PATH: file:/keys/public_key.pem
    volumes:
      # 내 PC 의 개발용 키를 읽기 전용으로 붙임
      - ./backend/api/keys:/keys:ro

volumes:
  nanumi-db-data:
