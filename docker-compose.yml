# 개발용 컨테이너 구성
#
#   docker compose up -d                          MySQL 만 띄움 (평소 개발)
#   docker compose --profile app up -d --build    앱까지 컨테이너로 띄움 (배포 전 확인용)
#   docker compose down                           내리기 (데이터 남음)
#   docker compose down -v                        데이터까지 지우기
#                                                 (V1 을 고쳤을 때. Flyway 가 체크섬을 저장하므로)
#
# 평소 개발은 MySQL 만 컨테이너로 띄우고 앱은 ./mvnw spring-boot:run 으로 돌리는 게 편함.
# 앱을 컨테이너에 넣으면 코드를 고칠 때마다 이미지를 다시 만들어야 해서 느려짐.
# 그래서 app 서비스는 profile 로 감춰 뒀고, --profile app 을 줄 때만 뜸.
#
# 포트는 안팎 모두 3307 로 통일함. 3306 은 다른 프로젝트가 쓰는 포트로 보고 건드리지 않음.
# 안쪽만 3306 으로 두면 "내 PC 에선 3307, 컨테이너끼리는 3306" 이라 헷갈리므로
# MySQL 자체를 3307 로 띄움(command 의 --port).
#
# 여기 DB 계정·비밀번호는 비밀값이 아님. 내 PC 안에서만 닿는 개발용 DB 이고,
# application.yml 의 개발용 기본값과 같은 이유로 그대로 적어 둠.
services:
  mysql:
    image: mysql:9
    container_name: nanumi-mysql
    restart: unless-stopped
    # MySQL 기본 포트는 3306 이므로 3307 로 띄우라고 알려 줘야 함
    command: ["--port=3307"]
    ports:
      - "3307:3307"
    environment:
      MYSQL_ROOT_PASSWORD: nanumi-local-root
      MYSQL_DATABASE: nanumi_dev
      MYSQL_USER: abc
      MYSQL_PASSWORD: aadd123
    volumes:
      # 이 줄이 없으면 컨테이너를 지울 때 테이블과 데이터가 함께 사라짐
      - nanumi-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3307", "-uroot", "-pnanumi-local-root"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # 배포 전에 "이미지가 실제로 뜨는지" 확인할 때만 씀
  api:
    profiles: ["app"]
    build: ./backend/api
    image: nanumi/api:latest
    container_name: nanumi-api
    depends_on:
      mysql:
        # MySQL 이 준비되기 전에 붙으면 기동이 실패하므로 기다림
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 컨테이너 안에서 localhost 는 "이 컨테이너 자신"이라서 MySQL 을 못 찾음.
      # compose 의 서비스 이름(mysql)으로 부름. 포트는 내 PC 와 같은 3307
      DB_URL: jdbc:mysql://mysql:3307/nanumi_dev?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: abc
      DB_PASSWORD: aadd123
      # 운영에서는 이 값이 GitHub Secrets 에서 옴. 여기 값은 확인용임
      PASSWORD_PEPPER: nanumi-local-dev-pepper
      CORS_ALLOWED_ORIGINS: http://localhost:5173

volumes:
  nanumi-mysql-data:
